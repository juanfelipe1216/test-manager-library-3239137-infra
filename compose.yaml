services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Falta DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Falta DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    volumes:
      - library_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../test-manager-library-3239137-api/backend
    ports:
      - "8000:8000"
    env_file:
      - ../test-manager-library-3239137-api/backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    volumes:
      - ../test-manager-library-3239137-api/backend:/app
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - composer install --no-interaction --no-scripts && php artisan serve --host=0.0.0.0 --port=8000

volumes:
  library_data: