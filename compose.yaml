services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Falta DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Falta DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    volumes:
      - library_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../test-manager-library-3239137-api/backend
    ports:
      - "8000:8000"
    env_file:
      - ../test-manager-library-3239137-api/backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ../test-manager-library-3239137-api/backend:/app
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - composer install --no-interaction --no-scripts && php artisan config:clear && php artisan migrate --force && php artisan library:admin && php artisan serve --host=0.0.0.0 --port=8000 --no-reload

  app:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../test-manager-library-3239137-app:/app
      - app_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

  page:
    build:
      context: ../test-manager-library-3239137-page
    ports:
      - "8080:80"

volumes:
  app_modules:
  library_data:
